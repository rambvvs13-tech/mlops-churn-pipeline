name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train model
      run: |
        python src/training/train.py
    
    - name: Test model exists
      run: |
        python -c "import joblib; model = joblib.load('models/best_churn_model.pkl'); print('✅ Model loaded successfully')"
    
    - name: Upload model
      uses: actions/upload-artifact@v4
      with:
        name: churn-model
        path: models/best_churn_model.pkl
